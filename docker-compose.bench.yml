# ЛР3: дашборд Grafana по результатам микробенчмарка.
#   bash ci/bench.sh grafana        # дамп results/bench/raw → Postgres, поднять Grafana
#   открыть http://localhost:3000   (вход не нужен, дашборд открывается сразу)
#   bash ci/bench.sh grafana-down
#
# Postgres хранит данные в tmpfs: при каждом `up` база заново заливается из
# results/bench/grafana/01_bench.sql.gz, т. е. дашборд всегда показывает последний прогон.
name: wildlife-bench-grafana

services:
  bench-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench      # локальная учебная БД, наружу не публикуется
      POSTGRES_DB: bench
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ${BENCH_GRAFANA_DATA:-./results/bench/grafana}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench && psql -U bench -d bench -tAc 'select 1 from runs limit 1' | grep -q 1"]
      interval: 2s
      timeout: 5s
      retries: 60

  grafana:
    image: grafana/grafana-oss:11.4.0
    depends_on:
      bench-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BENCH_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bench.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
