[database]
; Строка подключения к SQLite (путь относительно этого файла)
connection_string = sqlite:///wildlife.db

[business]
; Ключевой параметр бизнес-логики: минимум записей для расчёта тренда
min_records_for_trend = 5

[logging]
level = INFO
file = logs/app.log

[gui]
host = 127.0.0.1
port = 5000
secret_key = wildlife-local
