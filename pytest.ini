[pytest]
pythonpath = src
testpaths = tests
addopts =
    --cov=wildlife_business
    --cov=wildlife_data
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=0
    --alluredir=allure-results
    --clean-alluredir
    --random-order
markers =
    classical: state-based tests with real collaborators
    london: interaction tests with mocked collaborators
