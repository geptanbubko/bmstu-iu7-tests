[pytest]
pythonpath = src
; Обычный локальный `pytest` — unit + integration. E2E требует поднятого стенда:
; pytest tests/e2e (см. ci/run-tests.sh и docker-compose.test.yml).
testpaths = tests/unit tests/integration
; unit: test_*.py, integration: *_it.py (Integration Test), e2e: *_e2e.py
python_files = test_*.py *_it.py *_e2e.py
addopts =
    --cov=wildlife_business
    --cov=wildlife_data
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=0
    --alluredir=allure-results
    --clean-alluredir
    --random-order
markers =
    unit: этап 1 — изолированные тесты бизнес-логики и доступа к данным
    integration: этап 2 — сервисы и SqliteRepository на отдельном инстансе хранилища
    e2e: этап 3 — сценарий MVP через HTTP API развёрнутого стенда
    classical: state-based tests with real collaborators
    london: interaction tests with mocked collaborators
