{% extends "base.html" %}
{% block title %}Новое наблюдение{% endblock %}
{% block content %}
<h2>Новое наблюдение</h2>
{% if not form.can_submit %}
<p class="empty">Сначала администратор должен заполнить справочники видов, локаций и исследователей.</p>
{% endif %}
<form method="post">
  <label>Вид
    <select name="species_id" required>
      <option value="">— выберите —</option>
      {% for item in form.species %}
      <option value="{{ item.id }}" {% if form.values.get("species_id") == item.id|string %}selected{% endif %}>{{ item.label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Локация
    <select name="location_id" required>
      <option value="">— выберите —</option>
      {% for item in form.locations %}
      <option value="{{ item.id }}" {% if form.values.get("location_id") == item.id|string %}selected{% endif %}>{{ item.label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Исследователь
    <select name="researcher_id" required>
      <option value="">— выберите —</option>
      {% for item in form.researchers %}
      <option value="{{ item.id }}" {% if form.values.get("researcher_id") == item.id|string %}selected{% endif %}>{{ item.label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Дата
    <input type="date" name="observation_date" value="{{ form.values.get('observation_date', '') }}" required>
  </label>
  <label>Количество особей
    <input type="number" name="individuals_count" min="0" value="{{ form.values.get('individuals_count', '') }}" required>
  </label>
  <label>Заметки
    <input type="text" name="notes" value="{{ form.values.get('notes', '') }}">
  </label>
  <div class="actions">
    <button type="submit" {% if not form.can_submit %}disabled{% endif %}>Сохранить</button>
    <a href="{{ url_for('observations') }}">К списку</a>
  </div>
</form>
{% endblock %}
