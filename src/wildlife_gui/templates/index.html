{% extends "base.html" %}
{% block title %}Выбор роли{% endblock %}
{% block content %}
<h2>Выбор роли</h2>
<div class="grid">
  <div class="card">
    <h2>Исследователь</h2>
    <p>Фиксация наблюдений и анализ динамики популяции.</p>
    <form method="post" action="{{ url_for('select_role') }}">
      <input type="hidden" name="role" value="researcher">
      <button type="submit">Войти как исследователь</button>
    </form>
  </div>
  <div class="card">
    <h2>Администратор</h2>
    <p>Справочники видов, локаций и исследователей.</p>
    <form method="post" action="{{ url_for('select_role') }}">
      <input type="hidden" name="role" value="admin">
      <button type="submit">Войти как администратор</button>
    </form>
  </div>
</div>
{% endblock %}
