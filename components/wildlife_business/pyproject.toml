[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildlife-business"
version = "1.0.0"
description = "Компонент бизнес-логики Wildlife Monitoring"
requires-python = ">=3.11"

[tool.setuptools.package-dir]
"" = "../../src"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["wildlife_business*"]
