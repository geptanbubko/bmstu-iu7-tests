[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildlife-ui"
version = "1.0.0"
description = "Технологический UI Wildlife Monitoring"
requires-python = ">=3.11"
dependencies = ["wildlife-business==1.0.0"]

[tool.setuptools.package-dir]
"" = "../../src"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["wildlife_ui*"]
