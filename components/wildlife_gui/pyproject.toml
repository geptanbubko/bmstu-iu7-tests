[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildlife-gui"
version = "1.0.0"
description = "Графический UI Wildlife Monitoring (MVC)"
requires-python = ">=3.11"
dependencies = [
    "wildlife-business==1.0.0",
    "flask>=3.0",
]

[tool.setuptools.package-dir]
"" = "../../src"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["wildlife_gui*"]

[tool.setuptools.package-data]
wildlife_gui = ["templates/*.html", "static/*"]
